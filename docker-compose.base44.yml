services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: wordpressroot
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: on-failure

  wordpress:
    image: wordpress:php8.2-apache
    ports:
      - "3000:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX:-}
      WORDPRESS_CONFIG_EXTRA: |
        $$_b44 = getenv('BASE44_PUBLIC_HOST_SUFFIX');
        if ($$_b44) { $$_SERVER['HTTPS'] = 'on'; define('WP_HOME','https://3000-'.$$_b44); define('WP_SITEURL','https://3000-'.$$_b44); }
    volumes:
      - wp_data:/var/www/html
      - ./ntamba-processors:/var/www/html/wp-content/themes/ntamba-processors
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://localhost:80/\")!==false?0:1);'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: on-failure

  setup:
    image: wordpress:cli
    user: "33:33"
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./ntamba-processors:/var/www/html/wp-content/themes/ntamba-processors
      - ./scripts/base44-wp-setup.sh:/setup.sh:ro
    entrypoint: ["/bin/sh", "/setup.sh"]
    restart: "no"

volumes:
  db_data:
  wp_data:
